name: Publish API to Catalog

on:
  push:
    branches: [ main ]
    paths:
      - 'v1/apispec.yaml'
      - 'v1/apidoc.md'
      - 'v1/apimetadata.json'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4


      - name: Debug Secret Availability
        run: |
          if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            echo "AZURE_CLIENT_ID is EMPTY!"
          else
            echo "AZURE_CLIENT_ID is present (length: ${#{ secrets.AZURE_CLIENT_ID }})"
          fi
          if [ -z "${{ secrets.AZURE_TENANT_ID }}" ]; then
            echo "AZURE_TENANT_ID is EMPTY!"
          else
            echo "AZURE_TENANT_ID is present (length: ${#{ secrets.AZURE_TENANT_ID }})"
          fi
          if [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "AZURE_SUBSCRIPTION_ID is EMPTY!"
          else
            echo "AZURE_SUBSCRIPTION_ID is present (length: ${#{ secrets.AZURE_SUBSCRIPTION_ID }})"
          fi
          
      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate and Extract API Metadata & Version
        id: meta
        run: |
          if [ ! -f v1/apimetadata.json ]; then
            echo "Error: v1/apimetadata.json not found!"
            exit 1
          fi

          API_NAME=$(jq -r '.apiName' v1/apimetadata.json)
          API_VER=$(jq -r '.version' v1/apimetadata.json)

          if [ -z "$API_NAME" ] || [ "$API_NAME" == "null" ]; then
            echo "Error: 'apiName' is missing or null in v1/apimetadata.json"
            exit 1
          fi

          if [ -z "$API_VER" ] || [ "$API_VER" == "null" ]; then
            echo "Error: 'version' is missing or null in v1/apimetadata.json"
            exit 1
          fi

          echo "api_name=$API_NAME" >> $GITHUB_OUTPUT
          echo "api_ver=$API_VER" >> $GITHUB_OUTPUT

      - name: Upload API Artifacts to Azure Blob Storage
        uses: azure/cli@v2
        with:
          inlineScript: |
            BLOB_PATH="apicatalog/${{ steps.meta.outputs.api_name }}/${{ steps.meta.outputs.api_ver }}"
            STORAGE_ACCT="${{ secrets.AZURE_STORAGE_ACCOUNT }}"
            CONTAINER="apicatalog"

            az storage blob upload \
              --account-name "$STORAGE_ACCT" \
              --container-name "$CONTAINER" \
              --name "$BLOB_PATH/apispec.yaml" \
              --file v1/apispec.yaml \
              --auth-mode login \
              --overwrite

            az storage blob upload \
              --account-name "$STORAGE_ACCT" \
              --container-name "$CONTAINER" \
              --name "$BLOB_PATH/apidoc.md" \
              --file v1/apidoc.md \
              --auth-mode login \
              --overwrite

            az storage blob upload \
              --account-name "$STORAGE_ACCT" \
              --container-name "$CONTAINER" \
              --name "$BLOB_PATH/apimetadata.json" \
              --file v1/apimetadata.json \
              --auth-mode login \
              --overwrite
