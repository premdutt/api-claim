openapi: 3.0.3
info:
  title: Claims API
  description: API for creating, managing, and submitting insurance claims.
  version: 1.0.0
servers:
  - url: /v1
    description: Claims API version 1
tags:
  - name: Claims
    description: Create and manage claims
paths:
  /claims:
    get:
      tags:
        - Claims
      summary: List claims
      operationId: listClaims
      parameters:
        - name: limit
          in: query
          description: Maximum number of claims to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Cursor returned by a previous list response.
          schema:
            type: string
        - name: status
          in: query
          description: Return only claims with this status.
          schema:
            $ref: '#/components/schemas/ClaimStatus'
        - name: policyNumber
          in: query
          description: Return claims associated with this policy number.
          schema:
            type: string
        - name: incidentDateFrom
          in: query
          description: Include claims with an incident on or after this date.
          schema:
            type: string
            format: date
        - name: incidentDateTo
          in: query
          description: Include claims with an incident on or before this date.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Claims matching the supplied filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimList'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - Claims
      summary: Create a claim
      description: Creates a claim in draft status.
      operationId: createClaim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimCreate'
      responses:
        '201':
          description: Claim created.
          headers:
            Location:
              description: URL of the created claim.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: '#/components/responses/BadRequest'
  /claims/{claimId}:
    parameters:
      - name: claimId
        in: path
        required: true
        description: Unique identifier of the claim.
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Claims
      summary: Get a claim
      operationId: getClaim
      responses:
        '200':
          description: The requested claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Claims
      summary: Update a draft claim
      description: Only claims in draft status can be updated.
      operationId: updateClaim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimUpdate'
      responses:
        '200':
          description: Claim updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The claim is not in draft status and cannot be updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /claims/{claimId}/submit:
    parameters:
      - name: claimId
        in: path
        required: true
        description: Unique identifier of the claim.
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Claims
      summary: Submit a claim
      description: Submits a draft claim for review. A claim can only be submitted once.
      operationId: submitClaim
      responses:
        '200':
          description: Claim submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The claim is not in draft status and cannot be submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ClaimStatus:
      type: string
      description: Current lifecycle status of the claim.
      enum:
        - draft
        - submitted
        - under_review
        - approved
        - rejected
        - paid
        - withdrawn
    Claim:
      type: object
      required:
        - id
        - policyNumber
        - claimant
        - incident
        - requestedAmount
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        policyNumber:
          type: string
          minLength: 1
        claimant:
          $ref: '#/components/schemas/Claimant'
        incident:
          $ref: '#/components/schemas/Incident'
        requestedAmount:
          $ref: '#/components/schemas/Money'
        status:
          allOf:
            - $ref: '#/components/schemas/ClaimStatus'
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        submittedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
    ClaimCreate:
      type: object
      required:
        - policyNumber
        - claimant
        - incident
        - requestedAmount
      properties:
        policyNumber:
          type: string
          minLength: 1
          description: Policy associated with the claim.
        claimant:
          $ref: '#/components/schemas/Claimant'
        incident:
          $ref: '#/components/schemas/Incident'
        requestedAmount:
          $ref: '#/components/schemas/Money'
    ClaimUpdate:
      type: object
      minProperties: 1
      properties:
        policyNumber:
          type: string
          minLength: 1
        claimant:
          $ref: '#/components/schemas/Claimant'
        incident:
          $ref: '#/components/schemas/Incident'
        requestedAmount:
          $ref: '#/components/schemas/Money'
    Claimant:
      type: object
      required:
        - firstName
        - lastName
        - email
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
    Incident:
      type: object
      required:
        - date
        - description
      properties:
        date:
          type: string
          format: date
        description:
          type: string
          minLength: 1
          maxLength: 5000
        location:
          type: string
          maxLength: 500
    Money:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Amount requested, expressed in the specified currency.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Three-letter ISO 4217 currency code.
    ClaimList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Claim'
        pagination:
          type: object
          required:
            - limit
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 100
            nextCursor:
              type: string
              nullable: true
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested claim does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'